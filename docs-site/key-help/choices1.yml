# Descriptions of key and flag rows without FGD help (scripts/gen_entity_docs.py). Read from the code on develop.
game_player_settings:
  keys:
    weapon_ben:
      desc: "Gives the player the Benelli, or takes it away"
      choices:
        "-1": "Takes it away"
        "0": "Changes nothing"
        "1": "Gives it if the player doesn't have it yet"
        "2": "Always gives it, so a player who already has it gets more ammo for it"
