"delay before close (-1 stay open)": "Delay before close"
"delay before reset (-1 stay)": "Delay before reset"
"Also styles 1-63 (presets and named lights)": "Also styles 1-63"
"Acceleration units/sec^2": "Acceleration"
"Stop Deceleration units/sec^2": "Stop Deceleration"
"Fire on collision (shot) (locus = shot)": "Fire on collision (shot)"
"Fire on collision (shot) (locus = what it hit)": "Fire on collision (what it hit)"
