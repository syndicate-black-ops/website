# Provenance of the ported entities, keys, flags and features: the "Ported from" icons of the pages.
# Read by scripts/gen_entity_docs.py (entity pages) and docs-site/docusaurus.config.ts (every page).
#
# projects:   <id>: name (the icon's tooltip), url (the icon's link), icon (a file in static/img/ported/;
#             a project without an icon entry shows its name as a small text link)
# entities:   <class>: <project id> or [<id>, <id>]
# keys:       <class or base class>: { <key>: <project id or list> }
# flags:      <class or base class>: { <flag value>: <project id or list> }
#
# A list gives one icon per project, in its order. A key or flag of a base class is marked on every entity page
# that shows it (common base classes: on Common keys). SBO's own entities, keys and flags have no entry.
# Hand-written pages write [[ported:<id> <id>]] where the icons go.
#
# Where each icon comes from (copied into the site, never loaded from the project's site):
#   featureful.png   generated (Featureful has no logo; its documentation site uses the stock MkDocs favicon): a bold
#                    white "F" (DejaVu Sans Bold) on a #1f5fa8 rounded square, drawn at 128 px with Pillow, scaled to 32
#   sevenkewp.png    SevenKewp's client icon, https://wootguy.github.io/hlcoop_web/icon/client_sk.png (64x64, as is)
#   halflife-updated.png  avatar of the twhl-community GitHub organization, which publishes halflife-updated
#                    (https://avatars.githubusercontent.com/u/136572342), scaled to 32x32
#   bugfixedhl.png   generated (BugfixedHL-Rebased has no logo): a bold white "B" (DejaVu Sans Bold) on a #b03a2e
#                    rounded square, drawn at 128 px with Pillow, scaled to 32
#   spirit.png       Spirit of Half-Life's game icon (Spirit/game.ico, Spirit of Half-Life 1.9 source)
#   svencoop.png     favicon of www.svencoop.com
#   regamedll.png    ReGameDLL_CS's icon (regamedll/msvc/icon.ico in its repository)
#   cs16-client.png  cs16-client's logo (android/app/src/main/ic_launcher-playstore.png in its repository)
#   czeror.png       Condition Zero Deleted Scenes' game icon (as Featureful's documentation ships it)
#   aura.png         favicon of phoenixproject.cc (Aura's homepage on GitHub)
#   xdm.png          XDM's game icon (common/res/xhl.ico in the XDM source)
#   openag.png       favicon of openag.pro (OpenAG's homepage on GitHub)
#   discord-rpc.png  Discord's icon as the discord-rpc repository ships it (examples/unrealstatus)

