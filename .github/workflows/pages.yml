# The SBO docs site (https://sbo.sbotnas.io, GitHub Pages) and the offline manual of the game's release zip.
#   site     every push to main and every manual or release run (workflow_dispatch): the entity pages from the FGD
#            (scripts/gen_entity_docs.py), the checks, the Docusaurus build with the latest game release read from
#            GitHub (the build fails when it can't read it), then the Pages deployment
#   manual   every push to main: the same pages built as the offline manual (SBO_DOCS_MANUAL=1), checked and zipped
#            by scripts/docs_manual.sh, and published as sbo-manual-v<version>.zip + SHA256SUMS on the release
#            manual-v<version> of this repository (never Latest), where the game's release workflow downloads it
# The game's release workflow starts this workflow (workflow_dispatch) when it publishes a release, so the site shows
# the new release at once.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # the page history in each page's footer is git log: the whole history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml
      - name: Entity pages and checks
        run: |
          python3 scripts/gen_entity_docs.py --check
          python3 scripts/gen_entity_docs.py --list-empty | tee list-empty.txt
          test ! -s list-empty.txt || { echo "::error::key or flag rows without a description (above)"; exit 1; }
          python3 scripts/check_changes_sync.py
          python3 scripts/gen_entity_docs.py
          # after the generator: the links into the entity pages need them
          python3 scripts/check_docs_links.py
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs-site/.social-cache
          key: social-cards-${{ github.sha }}
          restore-keys: social-cards-
      - name: Build
        working-directory: docs-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SBO_DOCS_URL: https://sbo.sbotnas.io
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --out-dir ../site
          cp ../CNAME ../site/CNAME
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  manual:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-yaml zip
      - name: Build the manual
        working-directory: docs-site
        env:
          SBO_DOCS_MANUAL: "1"
        run: |
          python3 ../scripts/gen_entity_docs.py
          npm ci --no-audit --no-fund
          npm run build -- --out-dir ../manual
      - name: Check and zip
        id: pack
        run: |
          # the version the pages describe: the newest section of CHANGELOG.md (as docusaurus.config.ts reads it)
          version=$(sed -n 's/^## \[\([0-9]*\.[0-9]*\.[0-9]*\)\].*/\1/p' CHANGELOG.md | head -1)
          [ -n "$version" ] || { echo "::error::CHANGELOG.md has no ## [x.y.z] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bash scripts/docs_manual.sh pack manual out "$version"
      - name: Publish on the release manual-v<version>
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          tag=manual-v$VERSION
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "out/sbo-manual-v$VERSION.zip" out/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "out/sbo-manual-v$VERSION.zip" out/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --latest=false --title "SBO $VERSION offline manual" \
              --notes "The offline manual of SBO $VERSION (syndicate/manual/ in the game's release zip), built from the docs of this repository."
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | .name + " " + (.size|tostring)'
